name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    claude-review:
        name: Review pull request
        # A member's PR from a fork still has a trusted author_association, but GitHub withholds secrets from that
        # run, so claude-code-action would fail without CLAUDE_CODE_OAUTH_TOKEN.
        if: github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        runs-on: ubuntu-latest
        # claude-code-action posts the review with its Claude GitHub App token, which it gets through an OIDC
        # exchange, so pull-requests and issues permissions are left out here.
        permissions:
            contents: read
            id-token: write
            actions: read # claude-code-action skips its github_ci MCP server without this.

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
                  # claude-code-action runs `git fetch` with these credentials, then removes them before Claude starts.
                  persist-credentials: true # zizmor: ignore[artipacked]

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # claude-code-action merges these over the Claude GitHub App token's defaults
                  # (contents: write, pull_requests: write, issues: write).
                  additional_permissions: |
                      contents: read
                      actions: read

                  base_branch: main

                  # With a prompt and no track_progress, the action runs in agent mode. In agent mode it starts
                  # the inline-comment and CI MCP servers only when their tools are listed in --allowedTools.
                  claude_args: |
                      --model claude-opus-5-5
                      --effort xhigh
                      --allowedTools
                      "Bash(gh pr view:*)"
                      "Bash(gh pr diff:*)"
                      "Bash(gh pr comment:*)"
                      "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
                      "mcp__github_inline_comment__create_inline_comment"
                      "mcp__github_ci__get_ci_status"
                      "mcp__github_ci__get_workflow_run_details"
                      "mcp__github_ci__download_job_log"

                  # Anthropic's code-review plugin stops once Claude has commented on a PR. Every push must
                  # be reviewed, so this prompt is used instead.
                  prompt: |
                      Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} at head commit ${{ github.event.pull_request.head.sha }}. Every push to the pull request is reviewed, so the pull request may already have comments from earlier reviews.

                      1. Read the state, title and description of the pull request with `gh pr view ${{ github.event.pull_request.number }}`. If the pull request is closed or is a draft, stop without commenting.
                      2. Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`. Read each CLAUDE.md file at the repository root and in every directory on the path to a changed file.
                      3. Read the inline review comments already on the pull request with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`. Skip any issue that is already reported in one of these comments.
                      4. Look only for high-confidence problems in the changed code: code that will not parse or type-check, logic that is wrong without any assumption about its inputs, security flaws, and clear violations of a CLAUDE.md rule. For a CLAUDE.md violation, quote the rule in your comment. Skip style, nitpicks, problems that existed before this diff, and anything a linter would flag. Before you post an issue, check it against the code again, and drop it if you cannot confirm it.
                      5. Post each remaining issue as a separate inline comment with `mcp__github_inline_comment__create_inline_comment`, and pass `confirmed: true`. Include a suggestion block only when committing the suggestion as written fixes the issue completely.
                      6. Finish by posting one summary comment with `gh pr comment ${{ github.event.pull_request.number }}`. In it, name the head commit, and either list the issues you posted or state that you found no new issues.

            - name: Print Claude's error
              if: failure() && steps.claude-review.outputs.execution_file != ''
              env:
                  EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
              run: jq 'map(select(.type == "result")) | last | {subtype, is_error, result, errors}' "$EXECUTION_FILE"
