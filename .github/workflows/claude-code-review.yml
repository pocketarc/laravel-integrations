name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    claude-review:
        name: Review pull request
        if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
        runs-on: self-hosted
        # claude-code-action exchanges an OIDC token for its Claude GitHub App token and posts the review with that token.
        permissions:
            contents: read
            pull-requests: write # No step uses this; it is granted in case a later claude-code-action release depends on it.
            issues: read # Unused; granted for the same reason as pull-requests.
            id-token: write
            actions: read # claude-code-action skips its github_ci MCP server without this.

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
                  # claude-code-action runs `git fetch` with these credentials, then removes them before Claude starts.
                  persist-credentials: true # zizmor: ignore[artipacked]

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
                  plugins: 'code-review@claude-code-plugins'

                  additional_permissions: |
                      actions: read

                  base_branch: main

                  track_progress: true

                  claude_args: |
                      --model claude-opus-5-5
                      --effort xhigh

                  # Without `--comment`, the plugin writes the review only to the job log,
                  # and the only comment on the PR is the track_progress summary.
                  prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'

            - name: Print Claude's error
              if: failure() && steps.claude-review.outputs.execution_file != ''
              env:
                  EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
              run: jq 'map(select(.type == "result")) | last | {subtype, is_error, result, errors}' "$EXECUTION_FILE"
